<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<!-- Primary Meta Tags -->

		<meta name="title" content="Griplog • One app, all your routes" />

			name="description"
			content="A private climbing logbook that does one thing well: help you track your climbing. Log any route from any discipline. Indoor or outdoor."

		<meta
			name="keywords"
			content="climbing, bouldering, rock climbing, climbing tracker, climbing app, route tracker, climbing logbook"
		/>
		<meta name="author" content="Griplog" />

		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://griplog.app/" />
		<meta property="og:title" content="Griplog • One app, all your routes" />

			property="og:description"
			content="A private climbing logbook that does one thing well: help you track your climbing."

			property="twitter:description"

			property="twitter:image"
			content="https://griplog.app/assets/social.png"

		<link rel="icon" type="image/x-icon" href="assets/favicon.ico" />

			href="assets/favicon-32x32.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="assets/favicon-16x16.png"
		/>
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="assets/apple-touch-icon.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="192x192"

		/>
		<link
			rel="icon"
			type="image/png"
			sizes="512x512"

	<body class="landing-v2">

				<a href="/" class="newsletter-form-button v2-confirm-button">Back to home</a>

		<footer class="v2-footer">
			<p>
				© 2026 • <a href="/">Home</a> •
