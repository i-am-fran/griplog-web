  - heading "Privacy Policy" [level=1] [ref=e9]
  - generic [ref=e11]:
    - paragraph [ref=e12]: "Last updated: April 2026"
    - paragraph [ref=e14]: Griplog is a private climbing logbook. Your climbing data is stored locally on your device and synced via your personal iCloud account. We never see, access, or collect your routes, notes, or photos.
    - separator [ref=e15]
    - generic [ref=e16]:
      - heading "Data stored on your device" [level=2] [ref=e17]
      - paragraph [ref=e18]: All climbing data you enter into Griplog — routes, locations, events, journal entries, photos, and beta drawings — is stored exclusively on your device using Apple's Core Data framework. If you have iCloud enabled, this data syncs across your personal devices via CloudKit, Apple's private sync service. At no point does this data pass through or get stored on Griplog servers.
    - generic [ref=e19]:
      - heading "Data we do not collect" [level=2] [ref=e20]
      - list [ref=e21]:
        - listitem [ref=e22]: • Routes, grades, notes, or any climbing activity
        - listitem [ref=e23]: • Photos or beta drawings
        - listitem [ref=e24]: • Location data or GPS coordinates
        - listitem [ref=e25]: • Usage analytics or behavioral data
        - listitem [ref=e26]: • Device identifiers or advertising IDs
    - separator [ref=e27]
    - generic [ref=e28]:
      - heading "Waitlist email" [level=2] [ref=e29]
      - paragraph [ref=e30]:
        - text: If you sign up for the Griplog waitlist on this website, we collect your email address to send you updates about the app's availability. This is the only personal information we collect. We use
        - link "Loops" [ref=e31] [cursor=pointer]:
          - /url: https://loops.so
        - text: to manage this list. You can unsubscribe at any time using the link in any email we send.
      - paragraph [ref=e32]: We will never sell, share, or use your email for any other purpose.
    - generic [ref=e33]:
      - heading "Third-party services" [level=2] [ref=e34]
      - paragraph [ref=e35]: "The app and website use the following third-party services:"
      - list [ref=e36]:
        - listitem [ref=e37]:
          - text: •
          - strong [ref=e38]: Apple CloudKit
          - text: — for optional iCloud sync of your local data, governed by
          - link "Apple's Privacy Policy" [ref=e39] [cursor=pointer]:
            - /url: https://www.apple.com/legal/privacy/
        - listitem [ref=e40]:
          - text: •
          - strong [ref=e41]: Unsplash
          - text: — if you search for location cover photos in the app, your query is sent to Unsplash's API, governed by
          - link "Unsplash's Privacy Policy" [ref=e42] [cursor=pointer]:
            - /url: https://unsplash.com/privacy
        - listitem [ref=e43]:
          - text: •
          - strong [ref=e44]: Apple MapKit
          - text: — for location search and map display, governed by
          - link "Apple's Privacy Policy" [ref=e45] [cursor=pointer]:
            - /url: https://www.apple.com/legal/privacy/
        - listitem [ref=e46]:
          - text: •
          - strong [ref=e47]: Loops
          - text: — for waitlist email management (website only), governed by
          - link "Loops's Privacy Policy" [ref=e48] [cursor=pointer]:
            - /url: https://loops.so/privacy
    - separator [ref=e49]
    - generic [ref=e50]:
      - heading "Children's privacy" [level=2] [ref=e51]
      - paragraph [ref=e52]: Griplog is not directed at children under 13. We do not knowingly collect personal information from children.
    - generic [ref=e53]:
      - heading "Changes to this policy" [level=2] [ref=e54]
      - paragraph [ref=e55]: If we make material changes to this privacy policy, we will update the date at the top of this page. We encourage you to check back periodically.
